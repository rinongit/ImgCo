<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#294887">
  <title>Medical Center — Terminet</title>
  <style>
    :root{
      --bg-left:#254989;
      --bg-mid:#3d5691;
      --bg-right:#5b5495;
      --card:#f5f7fb;
      --white:#ffffff;
      --ink:#292b31;
      --muted:#8a8e96;
      --line:#aabbd2;
      --accent:#12b8e8;
      --weekday:#0d628b;
      --sunday:#e4323f;
      --row:23px;
      --shadow:0 5px 14px rgba(24,42,82,.10);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
    body{
      min-height:100vh;
      background:linear-gradient(115deg,var(--bg-left) 0%,var(--bg-mid) 53%,var(--bg-right) 100%);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
      outline:3px solid rgba(18,184,232,.32);
      outline-offset:2px;
    }

    .workspace{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
      padding:clamp(92px,20vh,218px) 0 54px;
      display:grid;
      grid-template-columns:minmax(340px,440px) minmax(280px,336px) minmax(280px,336px);
      gap:34px;
      align-items:start;
    }

    .left-column{min-width:0}
    .doctor-shell{
      position:relative;
      height:74px;
      border-radius:17px;
      background:var(--white);
      display:flex;
      align-items:center;
      padding:0 22px 0 27px;
      box-shadow:var(--shadow);
      z-index:8;
    }
    .doctor-shell::after{
      content:"";
      position:absolute;
      right:35px;
      bottom:-14px;
      width:0;height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-top:14px solid var(--white);
      filter:drop-shadow(0 2px 1px rgba(24,42,82,.04));
    }
    .doctor-button{
      min-width:0;
      flex:1;
      height:100%;
      border:0;
      background:transparent;
      color:#2f3035;
      font-size:20px;
      font-weight:800;
      text-align:left;
      padding:0 72px 0 0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .doctor-plus{
      position:absolute;
      right:24px;
      top:14px;
      width:46px;
      height:46px;
      border-radius:50%;
      border:0;
      background:var(--accent);
      color:white;
      font-size:32px;
      line-height:1;
      font-weight:400;
      display:grid;
      place-items:center;
      padding:0 0 3px;
      box-shadow:0 3px 8px rgba(18,184,232,.28);
      z-index:2;
    }
    .doctor-menu{
      position:absolute;
      left:0;
      right:0;
      top:82px;
      background:#fff;
      border:1px solid #edf0f4;
      border-radius:14px;
      padding:8px;
      box-shadow:0 18px 40px rgba(24,42,82,.22);
      display:none;
      z-index:30;
    }
    .doctor-menu.open{display:grid;gap:4px}
    .doctor-option{
      border:0;
      background:transparent;
      min-height:44px;
      border-radius:10px;
      padding:0 12px;
      text-align:left;
      color:#36383e;
      font-weight:700;
    }
    .doctor-option:hover,.doctor-option.active{background:#f2f6fb;color:#176d93}

    .calendar-card{
      margin-top:22px;
      background:var(--white);
      border-radius:18px;
      padding:27px 27px 24px;
      min-height:342px;
      box-shadow:var(--shadow);
    }
    .calendar-selectors{
      display:grid;
      grid-template-columns:1.3fr 1fr;
      gap:22px;
      margin-bottom:28px;
    }
    .calendar-selectors select{
      width:100%;
      height:54px;
      border:1px solid #eceef2;
      border-radius:11px;
      background:#f7f7f8;
      color:#33353a;
      font-size:16px;
      font-weight:750;
      padding:0 46px 0 20px;
      appearance:none;
      background-image:
        linear-gradient(45deg,transparent 50%,#686a6e 50%),
        linear-gradient(135deg,#686a6e 50%,transparent 50%);
      background-position:
        calc(100% - 26px) 23px,
        calc(100% - 20px) 23px;
      background-size:6px 6px,6px 6px;
      background-repeat:no-repeat;
    }
    .week,.days{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      text-align:center;
      align-items:center;
    }
    .week{
      color:var(--weekday);
      font-size:13px;
      font-weight:800;
      margin-bottom:14px;
    }
    .week span:last-child{color:var(--sunday)}
    .days{row-gap:8px}
    .days button{
      justify-self:center;
      width:35px;
      height:35px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:#33353a;
      font-size:12px;
      font-weight:750;
      display:grid;
      place-items:center;
      padding:0;
    }
    .days button.out{color:#c6c8cc}
    .days button.selected{
      background:var(--accent);
      color:#fff;
      box-shadow:0 2px 6px rgba(18,184,232,.26);
    }
    .days button.today:not(.selected){box-shadow:inset 0 0 0 1px #9fc8d8}
    .days button:hover:not(.selected){background:#eff7fa}

    .schedule{
      position:relative;
      background:var(--card);
      border-radius:16px;
      overflow:hidden;
      box-shadow:var(--shadow);
      padding:13px 26px 13px;
      min-width:0;
    }
    .schedule-body{position:relative}
    .slot{
      position:absolute;
      left:0;right:0;
      height:var(--row);
      border-bottom:1px solid var(--line);
    }
    .time{
      position:absolute;
      right:0;
      top:1px;
      min-width:54px;
      text-align:right;
      color:#25272b;
      font-size:13px;
      font-weight:750;
      line-height:17px;
      white-space:nowrap;
      background:var(--card);
      padding-left:7px;
    }
    .slot.hour .time{
      font-size:17px;
      font-weight:500;
      line-height:18px;
      top:0;
    }
    .hit{
      position:absolute;
      left:0;
      right:0;
      height:var(--row);
      border:0;
      background:transparent;
      z-index:2;
      padding:0;
    }
    .hit:hover{background:rgba(18,184,232,.055)}
    .appt{
      position:absolute;
      left:5px;
      right:67px;
      z-index:5;
      border:0;
      border-radius:7px;
      background:rgba(18,184,232,.90);
      color:#fff;
      text-align:left;
      padding:3px 7px;
      overflow:hidden;
      box-shadow:0 2px 5px rgba(30,75,106,.16);
    }
    .appt.waiting{background:rgba(209,151,62,.92)}
    .appt.completed{background:rgba(74,145,118,.92)}
    .appt.cancelled{background:rgba(145,149,158,.90);text-decoration:line-through}
    .appt strong{
      display:block;
      font-size:11px;
      line-height:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .appt small{
      display:block;
      margin-top:1px;
      font-size:9px;
      line-height:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      opacity:.96;
    }

    dialog{
      border:0;
      border-radius:16px;
      padding:0;
      width:min(520px,calc(100% - 24px));
      box-shadow:0 24px 80px rgba(15,23,42,.35);
      color:#344054;
    }
    dialog::backdrop{background:rgba(20,31,59,.52);backdrop-filter:blur(2px)}
    .modal{padding:21px}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
    .modal-head h2{margin:0;font-size:19px}
    .close{
      border:0;background:#f0f2f6;color:#667085;border-radius:9px;
      width:38px;height:38px;font-size:20px;
    }
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .field{display:grid;gap:6px}
    .field.full{grid-column:1/-1}
    .field label{font-size:12px;font-weight:700;color:#667085}
    .field input,.field select,.field textarea{
      width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;
      color:#344054;background:white;outline:none;
    }
    .field input:focus,.field select:focus,.field textarea:focus{
      border-color:#7fc9e2;box-shadow:0 0 0 3px #edf9fd
    }
    .field textarea{min-height:84px;resize:vertical}
    .modal-actions{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-top:18px}
    .right-actions{display:flex;gap:9px}
    .ghost-btn,.primary-btn,.danger-btn{
      border:0;border-radius:10px;min-height:43px;padding:0 15px
    }
    .ghost-btn{background:#eef1f5;color:#56606f}
    .primary-btn{background:var(--accent);color:#fff;font-weight:800}
    .danger-btn{background:#fff1f1;color:#b54747;border:1px solid #efcaca}
    .hidden{display:none!important}
    .doctor-list{display:grid;gap:8px;margin-top:8px}
    .doctor-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .doctor-item input{border:1px solid #d0d5dd;border-radius:9px;padding:9px 10px}
    .doctor-item button{border:0;background:#fff1f1;color:#a84848;border-radius:9px;min-width:38px;height:38px}
    .foot-note{margin-top:14px;font-size:11px;color:#858b96;line-height:1.45}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
      background:#202b44;color:white;padding:10px 14px;border-radius:10px;
      box-shadow:0 12px 32px rgba(0,0,0,.25);font-size:13px;z-index:60;
      opacity:0;pointer-events:none;transition:.18s;
    }
    .toast.show{opacity:1}

    @media(max-width:1060px){
      .workspace{
        width:min(760px,calc(100% - 28px));
        padding-top:54px;
        grid-template-columns:minmax(310px,1fr) minmax(280px,1fr);
      }
      .left-column{grid-column:1/-1;width:min(440px,100%);justify-self:center}
      .schedule{padding-left:22px;padding-right:22px}
    }

    @media(max-width:700px){
      :root{--row:27px}
      .workspace{
        width:calc(100% - 18px);
        padding:18px 0 30px;
        grid-template-columns:1fr;
        gap:18px;
      }
      .left-column,.schedule{width:min(440px,100%);justify-self:center}
      .doctor-shell{height:68px;border-radius:15px;padding-left:19px}
      .doctor-button{font-size:17px;padding-right:64px}
      .doctor-plus{width:43px;height:43px;right:18px;top:12px;font-size:29px}
      .doctor-shell::after{right:26px}
      .calendar-card{margin-top:18px;padding:20px 18px 20px;min-height:0}
      .calendar-selectors{gap:12px;margin-bottom:20px}
      .calendar-selectors select{height:50px;padding-left:15px;font-size:15px}
      .days{row-gap:6px}
      .days button{width:34px;height:34px}
      .schedule{padding:12px 18px}
      .time{font-size:13px}
      .slot.hour .time{font-size:16px}
      .appt{right:64px}
      .form-grid{grid-template-columns:1fr}
      .field.full{grid-column:auto}
      .modal-actions{align-items:stretch;flex-direction:column-reverse}
      .right-actions{display:grid;grid-template-columns:1fr 1fr}
      .modal-actions>button{width:100%}
    }

    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="workspace" id="app">
    <section class="left-column">
      <div class="doctor-shell" id="doctorShell">
        <button class="doctor-button" id="doctorButton" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
        <button class="doctor-plus" id="manageDoctors" type="button" aria-label="Menaxho mjekët" title="Menaxho mjekët">+</button>
        <div class="doctor-menu" id="doctorMenu" role="listbox" aria-label="Zgjidh mjekun"></div>
      </div>

      <section class="calendar-card" aria-label="Kalendari mujor">
        <div class="calendar-selectors">
          <select id="monthSelect" aria-label="Muaji"></select>
          <select id="yearSelect" aria-label="Viti"></select>
        </div>
        <div class="week" aria-hidden="true">
          <span>H</span><span>M</span><span>M</span><span>E</span><span>P</span><span>SH</span><span>D</span>
        </div>
        <div class="days" id="days"></div>
      </section>
    </section>

    <section class="schedule" id="scheduleMorning" aria-label="Oraret 08:00 deri 14:45"></section>
    <section class="schedule" id="scheduleEvening" aria-label="Oraret 15:00 deri 21:45"></section>
  </main>

  <dialog id="appointmentDialog">
    <form class="modal" id="appointmentForm">
      <div class="modal-head">
        <h2 id="appointmentHeading">Termin i ri</h2>
        <button class="close" id="closeAppointment" type="button" aria-label="Mbyll">×</button>
      </div>
      <div class="form-grid">
        <div class="field full">
          <label for="patient">Pacienti *</label>
          <input id="patient" name="patient" required autocomplete="off" maxlength="90">
        </div>
        <div class="field">
          <label for="phone">Telefoni</label>
          <input id="phone" name="phone" inputmode="tel" maxlength="35">
        </div>
        <div class="field">
          <label for="status">Statusi</label>
          <select id="status" name="status">
            <option value="confirmed">I konfirmuar</option>
            <option value="waiting">Në pritje</option>
            <option value="completed">Përfunduar</option>
            <option value="cancelled">Anuluar</option>
          </select>
        </div>
        <div class="field">
          <label for="apptDate">Data</label>
          <input id="apptDate" name="apptDate" type="date" required>
        </div>
        <div class="field">
          <label for="apptTime">Ora</label>
          <select id="apptTime" name="apptTime" required></select>
        </div>
        <div class="field">
          <label for="duration">Kohëzgjatja</label>
          <select id="duration" name="duration">
            <option value="15">15 min</option>
            <option value="30" selected>30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
            <option value="90">90 min</option>
            <option value="120">120 min</option>
          </select>
        </div>
        <div class="field">
          <label for="reason">Arsyeja</label>
          <input id="reason" name="reason" maxlength="100">
        </div>
        <div class="field full">
          <label for="notes">Shënime</label>
          <textarea id="notes" name="notes" maxlength="800"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button class="danger-btn hidden" id="deleteAppointment" type="button">Fshi termin</button>
        <div class="right-actions">
          <button class="ghost-btn" id="cancelAppointment" type="button">Anulo</button>
          <button class="primary-btn" type="submit">Ruaj</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="doctorsDialog">
    <form class="modal" id="doctorsForm">
      <div class="modal-head">
        <h2>Menaxho mjekët</h2>
        <button class="close" id="closeDoctors" type="button" aria-label="Mbyll">×</button>
      </div>
      <div class="doctor-list" id="doctorList"></div>
      <div class="modal-actions">
        <button class="ghost-btn" id="addDoctor" type="button">+ Shto mjek</button>
        <div class="right-actions">
          <button class="ghost-btn" id="cancelDoctors" type="button">Anulo</button>
          <button class="primary-btn" type="submit">Ruaj</button>
        </div>
      </div>
      <div class="foot-note">Terminet aktualisht ruhen në këtë shfletues. Sinkronizimi mes telefonit dhe kompjuterit do të lidhet me databazë në versionin pasues.</div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const root = document.getElementById('app');
  if (root.dataset.ready) return;
  root.dataset.ready = '1';

  const KEY = 'medical-center-calendar-v1';
  const sqMonths = ['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'];
  const statusLabel = {
    confirmed:'I konfirmuar',
    waiting:'Në pritje',
    completed:'Përfunduar',
    cancelled:'Anuluar'
  };
  const $ = id => document.getElementById(id);

  const doctorButton = $('doctorButton');
  const doctorMenu = $('doctorMenu');
  const monthSelect = $('monthSelect');
  const yearSelect = $('yearSelect');
  const daysEl = $('days');
  const scheduleMorning = $('scheduleMorning');
  const scheduleEvening = $('scheduleEvening');
  const appointmentDialog = $('appointmentDialog');
  const appointmentForm = $('appointmentForm');
  const doctorsDialog = $('doctorsDialog');
  const doctorsForm = $('doctorsForm');

  let editId = null;

  function localDateKey(d){
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function parseDateKey(key){
    const [y,m,d]=key.split('-').map(Number);
    return new Date(y,m-1,d,12,0,0,0);
  }

  function uuid(){
    return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
  }

  function defaultState(){
    const today=localDateKey(new Date());
    return {
      doctors:[{id:'rinon',name:'Dr. Rinon Dervishi PhDc'}],
      selectedDoctor:'rinon',
      selectedDate:today,
      viewMonth:today.slice(0,7)+'-01',
      appointments:[]
    };
  }

  function load(){
    try{
      const saved=JSON.parse(localStorage.getItem(KEY));
      if(saved && Array.isArray(saved.doctors) && Array.isArray(saved.appointments)){
        const merged=Object.assign(defaultState(),saved);
        merged.doctors=merged.doctors.map(d=>(
          d.id==='rinon' && d.name==='Dr. Rinon Dervishi PhDc.'
            ? {...d,name:'Dr. Rinon Dervishi PhDc'}
            : d
        ));
        return merged;
      }
    }catch(e){}
    return defaultState();
  }

  let state=load();
  if(!state.doctors.length) state.doctors=defaultState().doctors;
  if(!state.doctors.some(d=>d.id===state.selectedDoctor)) state.selectedDoctor=state.doctors[0].id;

  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function selectedDoctor(){return state.doctors.find(d=>d.id===state.selectedDoctor)||state.doctors[0]}
  function minutesToTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
  function timeToMinutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
  function formatLong(key){return new Intl.DateTimeFormat('sq-AL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parseDateKey(key))}
  function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  function toast(msg){
    const el=$('toast');
    el.textContent=msg;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t=setTimeout(()=>el.classList.remove('show'),1800);
  }

  function renderDoctorPicker(){
    doctorButton.textContent=selectedDoctor()?.name||'Zgjidh mjekun';
    doctorMenu.innerHTML='';
    state.doctors.forEach(d=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='doctor-option'+(d.id===state.selectedDoctor?' active':'');
      b.dataset.id=d.id;
      b.setAttribute('role','option');
      b.setAttribute('aria-selected',d.id===state.selectedDoctor?'true':'false');
      b.textContent=d.name;
      doctorMenu.append(b);
    });
  }

  function setupCalendarSelectors(){
    if(!monthSelect.options.length){
      sqMonths.forEach((name,index)=>{
        const o=document.createElement('option');
        o.value=String(index);
        o.textContent=name;
        monthSelect.append(o);
      });
    }
    const view=parseDateKey(state.viewMonth);
    const center=view.getFullYear();
    const minYear=Math.min(2020,center-6);
    const maxYear=Math.max(2036,center+10);
    yearSelect.innerHTML='';
    for(let y=minYear;y<=maxYear;y++){
      const o=document.createElement('option');
      o.value=String(y);
      o.textContent=String(y);
      yearSelect.append(o);
    }
    monthSelect.value=String(view.getMonth());
    yearSelect.value=String(view.getFullYear());
  }

  function renderCalendar(){
    setupCalendarSelectors();

    const v=parseDateKey(state.viewMonth);
    const y=v.getFullYear();
    const m=v.getMonth();
    const firstMondayOffset=(new Date(y,m,1).getDay()+6)%7;
    const daysInMonth=new Date(y,m+1,0).getDate();
    const cells=Math.ceil((firstMondayOffset+daysInMonth)/7)*7;
    const start=new Date(y,m,1-firstMondayOffset,12);

    daysEl.innerHTML='';
    for(let i=0;i<cells;i++){
      const d=new Date(start);
      d.setDate(start.getDate()+i);
      const key=localDateKey(d);
      const b=document.createElement('button');
      b.type='button';
      b.textContent=String(d.getDate()).padStart(2,'0');
      b.dataset.date=key;
      b.setAttribute('aria-label',formatLong(key));
      if(d.getMonth()!==m) b.classList.add('out');
      if(key===localDateKey(new Date())) b.classList.add('today');
      if(key===state.selectedDate) b.classList.add('selected');
      daysEl.append(b);
    }
  }

  function occupied(date,doctorId,startMin,duration,ignoreId){
    const end=startMin+duration;
    return state.appointments.some(a=>{
      if(a.id===ignoreId || a.date!==date || a.doctorId!==doctorId || a.status==='cancelled') return false;
      const aStart=timeToMinutes(a.time);
      const aEnd=aStart+Number(a.duration);
      return Math.max(startMin,aStart)<Math.min(end,aEnd);
    });
  }

  function makeSchedule(panel,startMin,endMin){
    panel.innerHTML='';
    const body=document.createElement('div');
    body.className='schedule-body';
    const rowCount=(endMin-startMin)/15;
    body.style.height=`calc(var(--row) * ${rowCount})`;

    for(let i=0;i<rowCount;i++){
      const min=startMin+i*15;

      const row=document.createElement('div');
      row.className='slot'+(min%60===0?' hour':'');
      row.style.top=`calc(var(--row) * ${i})`;

      const label=document.createElement('div');
      label.className='time';
      label.textContent=min%60===0
        ? `${Math.floor(min/60)}:00`
        : `:${String(min%60).padStart(2,'0')}`;
      row.append(label);
      body.append(row);

      const hit=document.createElement('button');
      hit.type='button';
      hit.className='hit';
      hit.style.top=`calc(var(--row) * ${i})`;
      hit.dataset.time=minutesToTime(min);
      hit.setAttribute('aria-label',`Shto termin në ${minutesToTime(min)}`);
      body.append(hit);
    }

    const appts=state.appointments
      .filter(a=>a.date===state.selectedDate && a.doctorId===state.selectedDoctor && timeToMinutes(a.time)>=startMin && timeToMinutes(a.time)<endMin)
      .sort((a,b)=>a.time.localeCompare(b.time));

    appts.forEach(a=>{
      const s=timeToMinutes(a.time);
      const idx=(s-startMin)/15;
      const span=Math.max(1,Math.ceil(Number(a.duration)/15));
      const b=document.createElement('button');
      b.type='button';
      b.className=`appt ${a.status||'confirmed'}`;
      b.dataset.id=a.id;
      b.style.top=`calc(var(--row) * ${idx} + 2px)`;
      b.style.height=`calc(var(--row) * ${span} - 4px)`;
      const detail=[a.phone,a.reason].filter(Boolean).join(' · ');
      b.innerHTML=`<strong>${escapeHtml(a.patient)}</strong><small>${a.time}${detail?' · '+escapeHtml(detail):''}</small>`;
      b.title=`${a.patient} — ${a.time} — ${statusLabel[a.status]||''}`;
      body.append(b);
    });

    panel.append(body);
  }

  function renderSchedule(){
    makeSchedule(scheduleMorning,8*60,15*60);
    makeSchedule(scheduleEvening,15*60,22*60);
  }

  function render(){
    renderDoctorPicker();
    renderCalendar();
    renderSchedule();
  }

  function fillTimeOptions(value){
    const sel=$('apptTime');
    sel.innerHTML='';
    for(let m=8*60;m<=21*60+45;m+=15){
      const t=minutesToTime(m);
      const o=document.createElement('option');
      o.value=t;
      o.textContent=t;
      sel.append(o);
    }
    sel.value=value||'08:00';
  }

  function openNew(time){
    editId=null;
    $('appointmentHeading').textContent='Termin i ri';
    appointmentForm.reset();
    $('apptDate').value=state.selectedDate;
    fillTimeOptions(time||'08:00');
    $('duration').value='30';
    $('status').value='confirmed';
    $('deleteAppointment').classList.add('hidden');
    appointmentDialog.showModal();
    setTimeout(()=>$('patient').focus(),30);
  }

  function openEdit(id){
    const a=state.appointments.find(x=>x.id===id);
    if(!a) return;
    editId=id;
    $('appointmentHeading').textContent='Ndrysho termin';
    $('patient').value=a.patient||'';
    $('phone').value=a.phone||'';
    $('status').value=a.status||'confirmed';
    $('apptDate').value=a.date;
    fillTimeOptions(a.time);
    $('duration').value=String(a.duration||30);
    $('reason').value=a.reason||'';
    $('notes').value=a.notes||'';
    $('deleteAppointment').classList.remove('hidden');
    appointmentDialog.showModal();
  }

  function closeAppt(){
    appointmentDialog.close();
    editId=null;
  }

  appointmentForm.addEventListener('submit',e=>{
    e.preventDefault();

    const patient=$('patient').value.trim();
    const date=$('apptDate').value;
    const time=$('apptTime').value;
    const duration=Number($('duration').value);
    const start=timeToMinutes(time);

    if(!patient){toast('Shkruaj emrin e pacientit');return}
    if(start<480 || start>1305 || start+duration>1320){
      toast('Termini duhet të përfundojë deri në 22:00');
      return;
    }
    if(occupied(date,state.selectedDoctor,start,duration,editId)){
      toast('Ky orar përplaset me një termin tjetër');
      return;
    }

    const data={
      id:editId||uuid(),
      doctorId:state.selectedDoctor,
      date,
      time,
      duration,
      patient,
      phone:$('phone').value.trim(),
      reason:$('reason').value.trim(),
      notes:$('notes').value.trim(),
      status:$('status').value
    };

    if(editId){
      const i=state.appointments.findIndex(a=>a.id===editId);
      state.appointments[i]=data;
    }else{
      state.appointments.push(data);
    }

    state.selectedDate=date;
    state.viewMonth=date.slice(0,7)+'-01';
    save();
    closeAppt();
    render();
    toast('Termini u ruajt');
  });

  $('deleteAppointment').addEventListener('click',()=>{
    if(!editId) return;
    if(!confirm('Ta fshij këtë termin?')) return;
    state.appointments=state.appointments.filter(a=>a.id!==editId);
    save();
    closeAppt();
    render();
    toast('Termini u fshi');
  });

  $('closeAppointment').addEventListener('click',closeAppt);
  $('cancelAppointment').addEventListener('click',closeAppt);

  [scheduleMorning,scheduleEvening].forEach(panel=>{
    panel.addEventListener('click',e=>{
      const appt=e.target.closest('.appt');
      if(appt){openEdit(appt.dataset.id);return}
      const hit=e.target.closest('.hit');
      if(hit) openNew(hit.dataset.time);
    });
  });

  daysEl.addEventListener('click',e=>{
    const b=e.target.closest('button[data-date]');
    if(!b) return;
    state.selectedDate=b.dataset.date;
    state.viewMonth=b.dataset.date.slice(0,7)+'-01';
    save();
    render();
  });

  function changeViewMonth(){
    const year=Number(yearSelect.value);
    const month=Number(monthSelect.value);
    const current=parseDateKey(state.selectedDate);
    const wantedDay=current.getDate();
    const maxDay=new Date(year,month+1,0).getDate();
    const next=new Date(year,month,Math.min(wantedDay,maxDay),12);
    state.selectedDate=localDateKey(next);
    state.viewMonth=`${year}-${String(month+1).padStart(2,'0')}-01`;
    save();
    render();
  }

  monthSelect.addEventListener('change',changeViewMonth);
  yearSelect.addEventListener('change',changeViewMonth);

  doctorButton.addEventListener('click',()=>{
    const open=!doctorMenu.classList.contains('open');
    doctorMenu.classList.toggle('open',open);
    doctorButton.setAttribute('aria-expanded',open?'true':'false');
  });

  doctorMenu.addEventListener('click',e=>{
    const option=e.target.closest('.doctor-option');
    if(!option) return;
    state.selectedDoctor=option.dataset.id;
    doctorMenu.classList.remove('open');
    doctorButton.setAttribute('aria-expanded','false');
    save();
    renderDoctorPicker();
    renderSchedule();
  });

  document.addEventListener('click',e=>{
    if(!e.target.closest('#doctorShell')){
      doctorMenu.classList.remove('open');
      doctorButton.setAttribute('aria-expanded','false');
    }
  });

  function renderDoctorEditor(){
    const list=$('doctorList');
    list.innerHTML='';
    state.doctors.forEach(d=>{
      const row=document.createElement('div');
      row.className='doctor-item';
      row.dataset.id=d.id;

      const input=document.createElement('input');
      input.value=d.name;
      input.maxLength=80;
      input.setAttribute('aria-label','Emri i mjekut');

      const del=document.createElement('button');
      del.type='button';
      del.textContent='×';
      del.setAttribute('aria-label','Fshi mjekun');
      if(state.doctors.length===1) del.disabled=true;

      row.append(input,del);
      list.append(row);
    });
  }

  $('manageDoctors').addEventListener('click',()=>{
    doctorMenu.classList.remove('open');
    doctorButton.setAttribute('aria-expanded','false');
    renderDoctorEditor();
    doctorsDialog.showModal();
  });

  $('addDoctor').addEventListener('click',()=>{
    const id=uuid();
    const row=document.createElement('div');
    row.className='doctor-item';
    row.dataset.id=id;

    const input=document.createElement('input');
    input.placeholder='Dr. Emri Mbiemri';
    input.maxLength=80;

    const del=document.createElement('button');
    del.type='button';
    del.textContent='×';

    row.append(input,del);
    $('doctorList').append(row);
    input.focus();
  });

  $('doctorList').addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b) return;
    const row=b.closest('.doctor-item');
    if($('doctorList').children.length<=1) return;
    row.remove();
  });

  doctorsForm.addEventListener('submit',e=>{
    e.preventDefault();
    const rows=[...$('doctorList').querySelectorAll('.doctor-item')];
    const next=rows
      .map(r=>({id:r.dataset.id,name:r.querySelector('input').value.trim()}))
      .filter(d=>d.name);

    if(!next.length){
      toast('Duhet të ketë të paktën një mjek');
      return;
    }

    const ids=new Set(next.map(d=>d.id));
    state.doctors=next;
    if(!ids.has(state.selectedDoctor)) state.selectedDoctor=next[0].id;
    save();
    doctorsDialog.close();
    render();
    toast('Lista e mjekëve u ruajt');
  });

  $('closeDoctors').addEventListener('click',()=>doctorsDialog.close());
  $('cancelDoctors').addEventListener('click',()=>doctorsDialog.close());

  [appointmentDialog,doctorsDialog].forEach(d=>{
    d.addEventListener('click',e=>{
      const r=d.getBoundingClientRect();
      if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) d.close();
    });
  });

  save();
  render();
})();
</script>
</body>
</html>
