services:
  db:
    image: postgres:16-alpine
    container_name: medcal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medcal
      POSTGRES_USER: medcal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcal -d medcal"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: medcal-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://medcal:${POSTGRES_PASSWORD}@db:5432/medcal
      PAIRING_CODE: ${PAIRING_CODE}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    ports:
      - "8787:3000"

networks:
  default:
    name: medcal-network
